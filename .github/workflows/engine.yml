name: TriggerBridge Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-engine:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Engine
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload Engine Artifact
        uses: actions/upload-artifact@v4
        with:
          name: triggerbridge-engine
          path: engine/build/libs/
